hooks:
  pre_tool_use:
    - description: Block access to .env files and secret material.
      policy:
        action: block
        when:
          path_contains:
            - ".env"
      reason: "BroPilot must never read or modify .env files."

    - description: Block access to Python virtual environments.
      policy:
        action: block
        when:
          path_contains:
            - ".venv"
      reason: "BroPilot must not inspect or modify virtual environment files."

    - description: Block modification of git metadata.
      policy:
        action: block
        when:
          path_contains:
            - ".git"
      reason: "BroPilot must not modify git internals or metadata."

    - description: Block destructive shell commands.
      policy:
        action: block
        when:
          command_contains:
            - "rm -rf"
            - "del /s"
            - "Remove-Item -Recurse"
            - "git reset --hard"
            - "git clean -fdx"
      reason: "Destructive operations require explicit human control."

  post_response:
    - description: Require human review before merge.
      policy:
        action: require_review
      reason: "BroPilot prepares reviewable changes but never merges on its own."
