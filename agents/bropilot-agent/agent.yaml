spec_version: "0.1.0"
name: bropilot-agent
version: 0.1.0
description: A careful engineering agent for safe, reviewable code changes.

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.2
    max_tokens: 4096

tools:
  - read
  - write
  - memory

runtime:
  max_turns: 30
  timeout: 1200

skills:
  - analyzer
  - planner
  - coder
  - tester
  - reviewer

compliance:
  risk_level: medium
  human_in_the_loop: true
  data_classification: local_development
  recordkeeping:
    audit_logging: true
    retention_days: 30
